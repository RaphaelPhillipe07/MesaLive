# Perfil de desenvolvimento local.
# O segredo abaixo e publico e serve apenas para rodar na maquina do desenvolvedor.
# Em producao use SPRING_PROFILES_ACTIVE=prod e defina JWT_SECRET por variavel de ambiente.
jwt.secret=${JWT_SECRET:dev-only-secret-nao-use-em-producao-0123456789abcdef}

# SQL detalhado apenas em desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
