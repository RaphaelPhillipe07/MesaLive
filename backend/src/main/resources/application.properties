spring.application.name=mesalive-backend

# Perfil ativo por padrao em ambiente local. Em producao defina SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# Database connection (sobrescreva via variaveis de ambiente em producao)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mesalive}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Server configuration
server.port=8080

# Security
# Obrigatorio em producao: no minimo 32 caracteres (HS256). Ver application-dev.properties.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
