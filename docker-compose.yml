services:
  db:
    image: postgres:15-alpine
    container_name: mesalive-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mesalive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
